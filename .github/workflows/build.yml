name: Build Aurora Downloader APK

on:
  push:
    branches: [main]
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.xml'
      - '**/*.toml'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleStandardDebug --no-daemon --stacktrace

      - name: Run unit tests
        run: gradle testStandardDebugUnitTest --no-daemon --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-report
          path: app/build/test-results/**/TEST-*.xml
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: Aurora-Downloader-APK
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
